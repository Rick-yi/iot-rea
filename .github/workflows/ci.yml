name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install packet tools
        run: |
          echo "wireshark-common/install-setuid-banner true" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1
      - run: npm run typecheck
      - run: npm test
        env:
          # Integration tests are not allowed to skip silently in CI.
          IOT_REA_REQUIRE_TOOLS: "1"
      - run: npm run build
      - name: CLI smoke test
        run: |
          node dist/cli.js doctor
          node dist/cli.js help
