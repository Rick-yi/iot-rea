name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: apt-get update
        run: sudo apt-get update
      - name: Install tshark
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: tshark version
        run: tshark --version
      - name: Install sigrok-cli
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sigrok-cli
      - name: sigrok version
        run: sigrok-cli --version
      - name: sigrok uart decoder
        run: sigrok-cli -L | grep -q uart
      - run: npm run typecheck
      - run: npm test
        env:
          # Integration tests are not allowed to skip silently in CI.
          IOT_REA_REQUIRE_TOOLS: "1"
      - run: npm run build
      - name: CLI smoke test
        run: |
          node dist/cli.js doctor
          node dist/cli.js help
